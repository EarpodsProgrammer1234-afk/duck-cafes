<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;

    font-family: Arial, sans-serif;

    color: #5b402d;
}

body {

    min-height: 100vh;

    background:
        url("cafe.png")
        center / cover
        no-repeat fixed;

}


/* HEADER */

.header {

    width: 100%;

    padding: 18px 28px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: transparent;

}

.logo {

    font-size: 25px;

    font-weight: bold;

}

.time,
.money {

    font-size: 14px;

}


/* ORDER */

.order {

    text-align: center;

    background: transparent;

}

.order-title {

    font-size: 12px;

    letter-spacing: 2px;

    font-weight: bold;

}

#order {

    margin-top: 6px;

    font-size: 18px;

}


/* DRINK */

h2 {

    text-align: center;

    margin: 12px 0;

}

#cup {

    width: 220px;
    height: 300px;

    margin: auto;

    position: relative;

}

#cupContents {

    position: relative;

    width: 100%;
    height: 100%;

}


/* DRINK IMAGES */

.drink-layer {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    cursor: pointer;

}


/* HINT */

.hint {

    text-align: center;

    font-size: 12px;

}


/* INGREDIENTS */

.ingredients-area {
    position: absolute;

    left: 0;
    bottom: 45px;

    width: 100%;

    text-align: center;

    background: transparent;
}

.ingredients {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 18px;

    flex-wrap: wrap;

    margin: 8px auto 12px;

    width: 90%;
}


/* NO GRAY BOXES */

.ingredient {
    appearance: none;
    -webkit-appearance: none;

    border: none;
    outline: none;

    background: transparent !important;

    box-shadow: none !important;

    color: #5b402d;

    font-family: inherit;

    font-weight: bold;

    cursor: pointer;

    padding: 8px;

    transition: transform 0.12s ease;
}

.ingredient:hover {
    background: transparent !important;

    transform: translateY(-5px);
}

.ingredient:active {
    transform: translateY(2px);
}


/* SERVE */

.serve {

    appearance: none;

    border: 0;

    background: #c9854b;

    color: white;

    padding: 11px 30px;

    border-radius: 8px;

    font-family: inherit;

    font-weight: bold;

    cursor: pointer;

}

.serve:hover {

    background: #d7955b;

}


/* RESULT */

#result {

    text-align: center;

    min-height: 25px;

    margin-top: 8px;

}


/* FOOTER */

.footer {

    text-align: center;

    padding: 10px;

    font-size: 12px;

    background: transparent;

}

function openIngredientList() {

    const popup =
        document.getElementById("ingredientList");

    const list =
        document.getElementById("selectedIngredientsList");

    list.innerHTML = "";

    if (currentDrink.length === 0) {

        list.textContent =
            "Nothing yet! 👀";

    } else {

        currentDrink.forEach(function(type) {

            const item =
                document.createElement("div");

            item.className =
                "selected-ingredient";

            item.textContent =
                "✓ " + ingredientInfo[type].name;

            list.appendChild(item);

        });

    }

    popup.style.display = "flex";

}


function closeIngredientList() {

    document.getElementById("ingredientList").style.display =
        "none";

}

function updateRecipeBook() {

    const list =

    recipes.forEach(function(recipe) {

            document.createElement("div");


        if (
            discoveredRecipes.includes(recipe.name)
        ) {

            entry.className =
                "recipe-entry";

            entry.textContent =
                "✓ " + recipe.name;

        }

        else {

            entry.className =
                "recipe-entry locked";

            entry.textContent =
                "🔒 ???";

        }


        list.appendChild(entry);

    });

}

/* =========================
   NEW RANDOM ORDER
========================= */

function newOrder() {

    currentDrink = [];

    document.getElementById("cupContents").innerHTML = "";

    document.getElementById("result").textContent = "";

    currentOrder =
        recipes[
            Math.floor(
                Math.random() * recipes.length
            )
        ];

    document.getElementById("order").textContent =
        currentOrder.orderText;

}


/* =========================
   ADD INGREDIENT
========================= */

function addIngredient(type) {

    currentDrink.push(type);

    const info = ingredientInfo[type];

    const ingredient = document.createElement("img");

    ingredient.className = "drink-layer";

    if (type === "lactoseFreeMilk") {
    ingredient.className =
        "drink-layer lactose-free-milk-layer";
}

    ingredient.src = info.image;

    ingredient.alt = info.name;

    ingredient.title =
        "Click to remove " + info.name;


    /* =========================
       LAYER ORDER
    ========================= */

   if (
    type === "milk" ||
    type === "lactoseFreeMilk" ||
    type === "espresso" ||
    type === "matcha" ||
    type === "strawberry" ||
    type === "sugar"
) {

    ingredient.style.zIndex = 1;

}

else if (type === "ice") {

    ingredient.style.zIndex = 10;

}

else if (type === "strawberry1") {

    ingredient.style.zIndex = 15;

}

else if (type === "boba") {

    ingredient.style.zIndex = 20;

}

else if (type === "vanilla") {

    ingredient.style.zIndex = 30;

}


    /* =========================
       REMOVE INGREDIENT
    ========================= */

    ingredient.onclick = function() {

        ingredient.remove();

        const index =
            currentDrink.indexOf(type);

        if (index !== -1) {

            currentDrink.splice(
                index,
                1
            );

        }

    };


    document
        .getElementById("cupContents")
        .appendChild(ingredient);

}

/* =========================
   UPDATE THE ACTUAL CUP
========================= */

function updateDrinkVisual() {

    const cupContents =
        document.getElementById("cupContents");

    cupContents.innerHTML = "";


    /* =========================
       ONE BASE
    ========================= */

    let baseType = null;

    if (currentDrink.includes("sugar")) {

        baseType = "sugar";

    }
    else if (currentDrink.includes("strawberry")) {

        baseType = "strawberry";

    }
    else if (currentDrink.includes("matcha")) {

        baseType = "matcha";

    }
    else if (currentDrink.includes("espresso")) {

        baseType = "espresso";

    }


    /* =========================
       DRAW BASE
    ========================= */

    if (baseType) {

        const base =
            document.createElement("img");

        base.src =
            ingredientInfo[baseType].image;

        base.alt =
            ingredientInfo[baseType].name;

        base.className =
            "drink-layer base-layer";

        base.style.zIndex = "1";

        cupContents.appendChild(base);

    }


    /* =========================
       TOPPING LAYERS
    ========================= */

    if (currentDrink.includes("ice")) {

        const ice =
            document.createElement("img");

        ice.src =
            ingredientInfo.ice.image;

        ice.alt = "Ice";

        ice.className =
            "drink-layer ice-layer";

        ice.style.zIndex = "10";

        cupContents.appendChild(ice);

    }


    if (currentDrink.includes("boba")) {

        const boba =
            document.createElement("img");

        boba.src =
            ingredientInfo.boba.image;

        boba.alt = "Boba";

        boba.className =
            "drink-layer boba-layer";

        boba.style.zIndex = "20";

        cupContents.appendChild(boba);

    }


    if (currentDrink.includes("vanilla")) {

        const vanilla =
            document.createElement("img");

        vanilla.src =
            ingredientInfo.vanilla.image;

        vanilla.alt = "Vanilla";

        vanilla.className =
            "drink-layer vanilla-layer";

        vanilla.style.zIndex = "30";

        cupContents.appendChild(vanilla);

    }

}


/* =========================
   REMOVE INGREDIENT
========================= */

function removeIngredient(type) {

    const index =
        currentDrink.indexOf(type);

    if (index !== -1) {

        currentDrink.splice(
            index,
            1
        );

    }

    updateDrinkVisual();

}


// UPDATE CASH

function updateMoney() {

    localStorage.setItem(
        "duckCafeMoney",
        money
    );

    document.querySelector(".money").textContent =
        "🪙 €" + money.toFixed(2);

}

/* =========================
   SERVE DRINK
========================= */

function serveDrink() {

    const result =
        document.getElementById("result");

    const playerRecipe =
        [...currentDrink].sort();

    const correctRecipe =
        [...currentOrder.ingredients].sort();


    if (
        JSON.stringify(playerRecipe) ===
        JSON.stringify(correctRecipe)
    ) {

        result.textContent =
            "✨ thanks! i love it!";


        /* =========================
           DISCOVER RECIPE
        ========================= */

        if (
            !discoveredRecipes.includes(
                currentOrder.name
            )
        ) {

            discoveredRecipes.push(
                currentOrder.name
            );

            localStorage.setItem(
                "duckCafeRecipes",
                JSON.stringify(
                    discoveredRecipes
                )
            );

            result.textContent +=
                " ✨ NEW RECIPE DISCOVERED!";

        }


    } else {

        result.textContent =
            "thats....not my order...❌";

    }


    // 50% chance of €1 tip

    if (Math.random() < 0.5) {

        money += 1;

        result.textContent +=
            " 💶 +€1 tip!";

        updateMoney();

    }


    // NEXT CUSTOMER NO MATTER WHAT

    setTimeout(() => {

        newOrder();

    }, 1500);

}

// NO IDEA

const cafeMusic = document.getElementById("cafeMusic");

document.addEventListener("click", function startMusic() {
    cafeMusic.play();
    document.removeEventListener("click", startMusic);
}, { once: true });

// RELATES TO NO IDEA

const muteMusic = document.getElementById("muteMusic");

muteMusic.addEventListener("click", function () {
    if (cafeMusic.paused) {
        cafeMusic.play();
        muteMusic.textContent = "🔇 Mute Music";
    } else {
        cafeMusic.pause();
        muteMusic.textContent = "🔊 Play Music";
    }
});

/* =========================
   START GAME
========================= */

newOrder();
updateMoney();

</script>
